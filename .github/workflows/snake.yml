
name: Generate Snake

# ─────────────────────────────────────────────────────────────
#  Renders your contribution graph as a snake-eating animation
#  and pushes the generated SVGs to the `output` branch, which
#  the profile README pulls from.
# ─────────────────────────────────────────────────────────────

on:
  # Run every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:
  # Also run on pushes to main so it stays fresh
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Ajith-softwaredeveloper
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300E5FF&color_dots=%230d1117,%237ee787,%2300E5FF,%23ff2e63,%23ff2e63

      - name: Push generated SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
